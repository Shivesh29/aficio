apiVersion: v1
kind: ConfigMap
metadata:
  name: aficio-config
  namespace: aficio
data:
  SPRING_PROFILES_ACTIVE: "k8s"
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
  SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED: "true"
  SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_LOWER_CASE_SERVICE_ID: "true"
  AFICIO_CORS_ALLOWED_ORIGINS: "http://localhost:5174,http://localhost:5173,http://localhost:3000"
  AFICIO_KAFKA_ENABLED: "true"
  AFICIO_REDIS_ENABLED: "true"
  AFICIO_FRONTEND_URL: "http://localhost:5174"
  AFICIO_AUTH_SERVICE_URL: "http://auth-service:8081"
  AFICIO_CATALOG_SERVICE_URL: "http://catalog-service:8082"
  AFICIO_MUSICBRAINZ_USER_AGENT: "Aficio/0.0.1 (contact@example.com)"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_JPA_OPEN_IN_VIEW: "false"