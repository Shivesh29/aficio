<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Card Gradient -->
    <radialGradient id="jacketBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e2026"/>
      <stop offset="60%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </radialGradient>

    <!-- Vinyl Disc Radial Gradient -->
    <radialGradient id="vinylBody" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d2e33"/>
      <stop offset="40%" stop-color="#18191d"/>
      <stop offset="85%" stop-color="#101114"/>
      <stop offset="100%" stop-color="#07080a"/>
    </radialGradient>

    <!-- Gold Center Label Gradient -->
    <linearGradient id="goldLabel" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f5cf68"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#b68e22"/>
      <stop offset="100%" stop-color="#8a670f"/>
    </linearGradient>

    <!-- Sheen reflection across grooves -->
    <linearGradient id="grooveSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="35%" stop-color="rgba(255,255,255,0.01)"/>
      <stop offset="65%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.0)"/>
    </linearGradient>

    <!-- Drop Shadow for Vinyl -->
    <filter id="vinylShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="labelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Album Sleeve / Outer Jacket -->
  <rect width="600" height="600" rx="16" fill="url(#jacketBg)"/>
  <rect width="596" height="596" x="2" y="2" rx="15" fill="none" stroke="#262830" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Subtle tactile sleeve grid / texture lines -->
  <g stroke="#ffffff" stroke-opacity="0.015" stroke-width="1">
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="150" y1="0" x2="150" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="450" y1="0" x2="450" y2="600"/>
  </g>

  <!-- Vinyl Record Disc -->
  <g filter="url(#vinylShadow)">
    <circle cx="300" cy="300" r="236" fill="url(#vinylBody)"/>
    <!-- Outer Rim -->
    <circle cx="300" cy="300" r="236" fill="none" stroke="#363840" stroke-width="2"/>
    <circle cx="300" cy="300" r="233" fill="none" stroke="#0e0f12" stroke-width="1.5"/>

    <!-- Concentric Grooves -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
      <circle cx="300" cy="300" r="224"/>
      <circle cx="300" cy="300" r="216"/>
      <circle cx="300" cy="300" r="206"/>
      <circle cx="300" cy="300" r="198"/>
      <circle cx="300" cy="300" r="188"/>
      <circle cx="300" cy="300" r="178"/>
      <circle cx="300" cy="300" r="168"/>
      <circle cx="300" cy="300" r="158"/>
      <circle cx="300" cy="300" r="148"/>
      <circle cx="300" cy="300" r="138"/>
      <circle cx="300" cy="300" r="128"/>
      <circle cx="300" cy="300" r="118"/>
    </g>

    <!-- Dark shadow rings between groove groups -->
    <g fill="none" stroke="#000000" stroke-opacity="0.3" stroke-width="2">
      <circle cx="300" cy="300" r="212"/>
      <circle cx="300" cy="300" r="183"/>
      <circle cx="300" cy="300" r="153"/>
      <circle cx="300" cy="300" r="123"/>
    </g>

    <!-- Run-out Lead Groove -->
    <circle cx="300" cy="300" r="105" fill="none" stroke="#1d1e22" stroke-width="4"/>

    <!-- Sheen overlay on disc -->
    <circle cx="300" cy="300" r="236" fill="url(#grooveSheen)" pointer-events="none"/>

    <!-- Center Label (Aficio Gold Label) -->
    <circle cx="300" cy="300" r="82" fill="url(#goldLabel)" filter="url(#labelShadow)"/>
    <circle cx="300" cy="300" r="81" fill="none" stroke="#e8bd42" stroke-width="1.5"/>
    <circle cx="300" cy="300" r="75" fill="none" stroke="#9e7210" stroke-width="0.75" stroke-dasharray="3,3"/>

    <!-- Brand Typography on Center Label -->
    <text x="300" y="246" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#241904" letter-spacing="3.5">AFICIO ARCHIVE</text>
    <text x="300" y="358" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#382909" letter-spacing="2">NO COVER ARTWORK</text>

    <!-- Aficio Record Symbol (Disc3 Geometry) -->
    <g transform="translate(300, 300)" stroke="#120e03" fill="none">
      <!-- Outer Record Ring -->
      <circle cx="0" cy="0" r="28" stroke-width="4.5"/>
      <!-- Soundwave / Vinyl Groove Arc Left -->
      <path d="M-17 0 C-17 -4.8 -15 -9.1 -11.9 -11.9" stroke-width="4" stroke-linecap="round"/>
      <!-- Center Spindle Hub Outer -->
      <circle cx="0" cy="0" r="9" stroke-width="3.5"/>
      <!-- Center Spindle Hole (hole through vinyl) -->
      <circle cx="0" cy="0" r="4.5" fill="#121316"/>
      <!-- Soundwave / Vinyl Groove Arc Right -->
      <path d="M17 0 C17 4.8 15 9.1 11.9 11.9" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Top-left subtle brand mark on jacket sleeve -->
  <g transform="translate(36, 44)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="900" fill="#ffffff" fill-opacity="0.35" letter-spacing="-0.5">aficio<tspan fill="#d4af37">.</tspan></text>
  </g>

  <!-- Bottom corner indicator -->
  <g transform="translate(564, 560)">
    <text x="0" y="0" text-anchor="end" font-family="monospace" font-size="10" font-weight="600" fill="#ffffff" fill-opacity="0.2" letter-spacing="1.5">33⅓ RPM</text>
  </g>
</svg>
