# ─────────────────────────────────────────────────────────────────────────────
# NOTIFICATION SERVICE — service-specific configuration
# Owns: notification table
# Consumes Kafka events:
#   - aficio.social.events  (group: aficio-notification)
# Delivers notifications via WebSocket/STOMP
# Exposes REST: /api/notifications/** (history, mark-read, unread count)
# Uses Redis for unread notification count cache
# Port: 8084
# ─────────────────────────────────────────────────────────────────────────────

server:
  port: 8084

spring:
  application:
    name: notification-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${SPRING_DATASOURCE_USERNAME:aficio_user}
    password: ${SPRING_DATASOURCE_PASSWORD:aficio_password}
    hikari:
      pool-name: notification-pool
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    locations: classpath:db/migration
    schemas: public

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: aficio-notification
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      max-poll-records: 50
    listener:
      ack-mode: manual_immediate

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    com.aficio.notification: DEBUG

aficio:
  auth:
    service-url: ${AFICIO_AUTH_SERVICE_URL:http://localhost:8081}
  resend:
    api-key: ${AFICIO_RESEND_API_KEY:}
    from: ${AFICIO_RESEND_FROM:Aficio <onboarding@resend.dev>}
  frontend:
    url: ${AFICIO_FRONTEND_URL:http://localhost:5174}
