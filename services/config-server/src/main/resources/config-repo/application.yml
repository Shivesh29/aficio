# ─────────────────────────────────────────────────────────────────────────────
# SHARED CONFIGURATION — applies to ALL Aficio microservices.
#
# Values using ${ENV_VAR:dev-default} pattern:
#   - ENV_VAR  → used in production (supplied via env / secrets manager)
#   - dev-default → used locally when the variable is not set
#
# NEVER put real credentials here. This file is version-controlled.
# ─────────────────────────────────────────────────────────────────────────────

# All services register with Eureka and discover each other through it.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    # Shorter heartbeat intervals for faster dev feedback.
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# ─── Spring shared settings ──────────────────────────────────────────────────
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

# ─── JWT shared secret ───────────────────────────────────────────────────────
# Must be identical across all services and the gateway.
# In production, supply AFICIO_JWT_SECRET as a secret — minimum 32 characters.
aficio:
  jwt:
    secret: ${AFICIO_JWT_SECRET:aficio-development-secret-key-must-be-at-least-32-characters}
  frontend:
    url: ${AFICIO_FRONTEND_URL:http://localhost:5174}
  cors:
    allowed-origins: ${AFICIO_CORS_ALLOWED_ORIGINS:http://localhost:*}

# ─── Actuator / Observability ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [traceId=%X{traceId:-}] %-5level %logger{36} - %msg%n"
  level:
    com.aficio: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
