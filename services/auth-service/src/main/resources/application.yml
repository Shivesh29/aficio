server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:aficio_user}
    password: ${SPRING_DATASOURCE_PASSWORD:aficio_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    schemas: public
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

aficio:
  resend:
    api-key: ${AFICIO_RESEND_API_KEY:}
    from: ${AFICIO_RESEND_FROM:Aficio <onboarding@resend.dev>}
  redis:
    enabled: ${AFICIO_REDIS_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-to-a-long-random-string}
  frontend:
    url: ${AFICIO_FRONTEND_URL:http://localhost:5174}
  cors:
    allowed-origins: ${AFICIO_CORS_ALLOWED_ORIGINS:http://localhost:*,http://localhost:5174,http://localhost:5173,http://localhost:3000}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
