services:
  postgres:
    image: postgres:16-alpine
    container_name: aficio-postgres
    shm_size: 512m
    restart: unless-stopped
    environment:
      POSTGRES_USER: aficio_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aficio_password}
      POSTGRES_DB: auth_db
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    command: >
      postgres
      -c 'max_connections=100'
      -c 'shared_buffers=128MB'
      -c 'work_mem=16MB'
      -c 'maintenance_work_mem=64MB'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aficio_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aficio-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: aficio-auth-service
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      SPRING_APPLICATION_NAME: auth-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: aficio_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aficio_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_DATA_REDIS_HOST: redis
      AFICIO_JWT_SECRET: ${JWT_SECRET:-change-me-in-production-to-a-long-random-string}
      AFICIO_REDIS_ENABLED: 'true'
      AFICIO_FRONTEND_URL: ${AFICIO_FRONTEND_URL:-http://localhost:5174}
      AFICIO_CORS_ALLOWED_ORIGINS: ${AFICIO_CORS_ALLOWED_ORIGINS:-http://localhost:*,http://localhost,http://localhost:5174,http://localhost:5173,http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      AFICIO_RESEND_API_KEY: ${RESEND_API_KEY:-}
      AFICIO_RESEND_FROM: ${RESEND_FROM:-Aficio <onboarding@resend.dev>}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m -Dnetworkaddress.cache.ttl=3 -Dnetworkaddress.cache.negative.ttl=1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10

  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: aficio-catalog-service
    restart: unless-stopped
    expose:
      - "8082"
    environment:
      SPRING_APPLICATION_NAME: catalog-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog_db
      SPRING_DATASOURCE_USERNAME: aficio_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aficio_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_DATA_REDIS_HOST: redis
      AFICIO_REDIS_ENABLED: 'true'
      AFICIO_CORS_ALLOWED_ORIGINS: ${AFICIO_CORS_ALLOWED_ORIGINS:-http://localhost:*,http://localhost,http://localhost:5174,http://localhost:5173,http://localhost:3000}
      AFICIO_JWT_SECRET: ${JWT_SECRET:-change-me-in-production-to-a-long-random-string}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      AFICIO_YOUTUBE_ALBUM_SYNC_LIMIT: 4
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms128m -Dnetworkaddress.cache.ttl=3 -Dnetworkaddress.cache.negative.ttl=1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10

  social-service:
    build:
      context: ./services/social-service
      dockerfile: Dockerfile
    container_name: aficio-social-service
    restart: unless-stopped
    expose:
      - "8083"
    environment:
      SPRING_APPLICATION_NAME: social-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/social_db
      SPRING_DATASOURCE_USERNAME: aficio_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aficio_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: redis
      AFICIO_REDIS_ENABLED: 'true'
      AFICIO_CORS_ALLOWED_ORIGINS: ${AFICIO_CORS_ALLOWED_ORIGINS:-http://localhost:*,http://localhost,http://localhost:5174,http://localhost:5173,http://localhost:3000}
      AFICIO_JWT_SECRET: ${JWT_SECRET:-change-me-in-production-to-a-long-random-string}
      AFICIO_AUTH_SERVICE_URL: http://auth-service:8081
      AFICIO_CATALOG_SERVICE_URL: http://catalog-service:8082
      AFICIO_FRONTEND_URL: ${AFICIO_FRONTEND_URL:-http://localhost:5174}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m -Dnetworkaddress.cache.ttl=3 -Dnetworkaddress.cache.negative.ttl=1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: aficio-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      AFICIO_AUTH_SERVICE_URL: http://auth-service:8081
      AFICIO_CATALOG_SERVICE_URL: http://catalog-service:8082
      AFICIO_SOCIAL_SERVICE_URL: http://social-service:8083
      AFICIO_SOCIAL_WS_URL: ws://social-service:8083
      AFICIO_CORS_ALLOWED_ORIGINS: ${AFICIO_CORS_ALLOWED_ORIGINS:-http://localhost:*,http://localhost,http://localhost:5174,http://localhost:5173,http://localhost:3000}
      JAVA_TOOL_OPTIONS: "-Xmx192m -Xms96m -Dnetworkaddress.cache.ttl=3 -Dnetworkaddress.cache.negative.ttl=1"
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      social-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aficio-frontend
    restart: unless-stopped
    ports:
      - "5174:5174"
      - "80:5174"
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
