apiVersion: apps/v1
kind: Deployment
metadata:
  name: activity-service
  namespace: aficio
  labels:
    app: activity-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: activity-service
  template:
    metadata:
      labels:
        app: activity-service
    spec:
      containers:
        - name: activity-service
          image: aficio/activity-service:latest
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_APPLICATION_NAME
              value: "activity-service"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/activity_db"
            - name: SPRING_DATASOURCE_USERNAME
              value: "aficio_user"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aficio-secrets
                  key: postgres-password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              valueFrom:
                configMapKeyRef:
                  name: aficio-config
                  key: SPRING_JPA_HIBERNATE_DDL_AUTO
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: aficio-secrets
                  key: kafka-bootstrap-servers
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: AFICIO_KAFKA_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: aficio-config
                  key: AFICIO_KAFKA_ENABLED
            - name: AFICIO_REDIS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: aficio-config
                  key: AFICIO_REDIS_ENABLED
            - name: AFICIO_CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: aficio-config
                  key: AFICIO_CORS_ALLOWED_ORIGINS
            - name: AFICIO_AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: aficio-config
                  key: AFICIO_AUTH_SERVICE_URL
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: aficio-config
                  key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: activity-service
  namespace: aficio
  labels:
    app: activity-service
spec:
  ports:
    - port: 8085
      targetPort: 8085
  selector:
    app: activity-service