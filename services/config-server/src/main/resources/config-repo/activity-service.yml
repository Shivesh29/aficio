# ─────────────────────────────────────────────────────────────────────────────
# ACTIVITY SERVICE — service-specific configuration
# Owns: activity table
# Consumes Kafka events:
#   - aficio.social.events  (group: activity-service)
# Exposes REST: /api/activity/**, /api/feed/**
# Port: 8085
# ─────────────────────────────────────────────────────────────────────────────

server:
  port: 8085

spring:
  application:
    name: activity-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/activity_db}
    username: ${SPRING_DATASOURCE_USERNAME:aficio_user}
    password: ${SPRING_DATASOURCE_PASSWORD:aficio_password}
    hikari:
      pool-name: activity-pool
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    locations: classpath:db/migration
    schemas: public

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: aficio-activity
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      max-poll-records: 100
    listener:
      ack-mode: manual_immediate

logging:
  level:
    com.aficio.activity: DEBUG

aficio:
  auth:
    service-url: ${AFICIO_AUTH_SERVICE_URL:http://localhost:8081}
