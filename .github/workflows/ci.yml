name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Compile and Test Services
        run: ./mvnw clean test -B -pl shared/kafka-events,shared/dto-lib,services/api-gateway,services/auth-service,services/catalog-service,services/social-service -am

  frontend:
    name: Frontend TypeScript & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Check & Vite Build
        working-directory: frontend
        run: npm run build

  docker-compose-build:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Package Service JARs
        run: ./mvnw package -DskipTests -B -pl shared/kafka-events,shared/dto-lib,services/api-gateway,services/auth-service,services/catalog-service,services/social-service -am

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate Docker Compose Configuration & Build Stack
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose build
