# ─────────────────────────────────────────────────────────────────────────────
# SOCIAL SERVICE — service-specific configuration
# Owns: review, review_like, review_comment, follow, music_list,
#        music_list_item, direct_message tables
# Publishes Kafka events: aficio.social.events
# Uses OpenFeign to call: auth-service (user validation), catalog-service (album validation)
# Hosts WebSocket/STOMP endpoint for real-time direct messages
# Port: 8083
# ─────────────────────────────────────────────────────────────────────────────

server:
  port: 8083

spring:
  application:
    name: social-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/social_db}
    username: ${SPRING_DATASOURCE_USERNAME:aficio_user}
    password: ${SPRING_DATASOURCE_PASSWORD:aficio_password}
    hikari:
      pool-name: social-pool
      maximum-pool-size: 15
      minimum-idle: 3

  flyway:
    locations: classpath:db/migration
    schemas: public

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

# OpenFeign timeouts
feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000
      auth-service:
        connect-timeout: 2000
        read-timeout: 3000
      catalog-service:
        connect-timeout: 2000
        read-timeout: 3000

logging:
  level:
    com.aficio.social: DEBUG

aficio:
  auth:
    service-url: ${AFICIO_AUTH_SERVICE_URL:http://localhost:8081}
  catalog:
    service-url: ${AFICIO_CATALOG_SERVICE_URL:http://localhost:8082}
