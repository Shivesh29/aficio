# ─────────────────────────────────────────────────────────────────────────────
# AUTH SERVICE — service-specific configuration
# Owns: app_user table, JWT generation/validation, email verification, 2FA
# Port: 8081
# ─────────────────────────────────────────────────────────────────────────────

server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:aficio_user}
    password: ${SPRING_DATASOURCE_PASSWORD:aficio_password}
    hikari:
      pool-name: auth-pool
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    locations: classpath:db/migration
    schemas: public

aficio:
  resend:
    api-key: ${AFICIO_RESEND_API_KEY:}
    from: ${AFICIO_RESEND_FROM:Aficio <onboarding@resend.dev>}

logging:
  level:
    com.aficio.auth: DEBUG
