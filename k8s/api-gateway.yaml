apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: aficio
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: aficio/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_APPLICATION_NAME
              value: "api-gateway"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: aficio-config
                  key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
            - name: SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: aficio-config
                  key: SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED
            - name: SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_LOWER_CASE_SERVICE_ID
              valueFrom:
                configMapKeyRef:
                  name: aficio-config
                  key: SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_LOWER_CASE_SERVICE_ID
            - name: AFICIO_CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: aficio-config
                  key: AFICIO_CORS_ALLOWED_ORIGINS
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: aficio
  labels:
    app: api-gateway
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: api-gateway