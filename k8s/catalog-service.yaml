apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: aficio
  labels:
    app: catalog-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: aficio/catalog-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_APPLICATION_NAME
              value: "catalog-service"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/catalog_db"
            - name: SPRING_DATASOURCE_USERNAME
              value: "aficio_user"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aficio-secrets
                  key: postgres-password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              valueFrom:
                configMapKeyRef:
                  name: aficio-config
                  key: SPRING_JPA_HIBERNATE_DDL_AUTO
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: AFICIO_MUSICBRAINZ_USER_AGENT
              valueFrom:
                configMapKeyRef:
                  name: aficio-config
                  key: AFICIO_MUSICBRAINZ_USER_AGENT
            - name: AFICIO_KAFKA_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: aficio-config
                  key: AFICIO_KAFKA_ENABLED
            - name: AFICIO_REDIS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: aficio-config
                  key: AFICIO_REDIS_ENABLED
            - name: AFICIO_CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: aficio-config
                  key: AFICIO_CORS_ALLOWED_ORIGINS
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: aficio-config
                  key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: aficio
  labels:
    app: catalog-service
spec:
  ports:
    - port: 8082
      targetPort: 8082
  selector:
    app: catalog-service